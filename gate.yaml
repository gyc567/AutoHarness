version: 1

# 路径黑名单（loop 永不修改；违规立即 halt + escalate）
denylist:
  - ".env"
  - ".env.*"
  - "**/secrets/**"
  - "**/*_key*"
  - "**/*_secret*"
  - "**/Cargo.lock"             # 强制 deny；dependency-watch 只开 PR、不自动改 lockfile
  - "src/core/harness.rs"       # 核心 trait 改动需 review
  - "src/engine/synthesis.rs"   # 核心引擎改动需 review
  - "src/engine/thompson.rs"    # 采样逻辑改动需 review
  - "src/main.rs"               # CLI 入口改动需 review
  - "gate.yaml"                 # 门禁配置本身只能人类改
  - "loop-constraints.md"       # 强制约束本身只能人类改

# 单次 L2 自动 commit 的最大文件数（含 diff）
maxFiles: 10

# autoMerge 允许清单（仅 L2 升级后启用；main 永不自动 merge，仍需 PR review）
autoMergeAllowlist:
  - "docs/**"
  - "**/*.md"
  - "tests/**"
  - "skills/**/SKILL.md"
  - "scripts/**"

# 三层写入规则（与 loop-constraints.md §Push & Merge 对齐）
writePolicy:
  prBranchAutoCommit: true       # PR 分支内可自动 commit（fmt 修复等）
  allowlistAutoMerge: false      # allowlist 路径可自动 merge（默认关闭，需 L2 升级）
  mainAutoMerge: false           # main 永不自动 merge
  l1ReportAutoPush: true         # loop-bot 的 L1 报告 push 仅限 STATE/LOOP/log，是唯一自动 push 例外