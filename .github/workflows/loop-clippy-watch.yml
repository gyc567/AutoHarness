name: Loop Clippy/Fmt Watch

# 详见 docs/loop-engineering/patterns-and-levels.md §1.5
# Phase 4 启用（per implementation-roadmap.md）

on:
  pull_request:

permissions:
  contents: write       # PR 分支内可自动 commit
  pull-requests: write  # 评论

jobs:
  loop-clippy-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Build
        run: cargo build --release

      - name: Run loop (L1 report-only)
        run: |
          cargo run --release -- loop run \
            --pattern clippy-fmt-watch \
            --level L1

      - name: Auto-fix fmt if needed
        run: |
          if ! cargo fmt -- --check; then
            cargo fmt
            git config user.name "loop-bot"
            git config user.email "loop-bot@users.noreply.github.com"
            git add -u
            git commit -m "loop(clippy-fmt-watch): auto-fix fmt [skip ci]"
            git push
          fi

      - name: Comment on PR if clippy fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **loop(clippy-fmt-watch) L1 report**: `cargo clippy -- -D warnings` 失败。请手动修复（src/** 不在 allowlist，loop 不自动修）。'
            })