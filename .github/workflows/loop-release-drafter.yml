name: Loop Release Drafter

# 详见 docs/loop-engineering/patterns-and-levels.md §1.6

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # 写 CHANGELOG_DRAFT.md
  issues: write         # 开 review issue

jobs:
  loop-release-drafter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: cargo build --release

      - name: Generate CHANGELOG_DRAFT
        run: |
          # 收集最近 N 个 commit，按 conventional commits 分类
          # 简化：从上次 tag 到当前 tag 的 commit
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [[ -z "$PREV_TAG" ]]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          cat > CHANGELOG_DRAFT.md << EOF
          # Release Notes Draft — ${{ github.ref_name }}
          ## Commits since $PREV_TAG
          EOF
          git log $RANGE --pretty=format:'- %s (%h)' >> CHANGELOG_DRAFT.md

      - name: Commit draft
        run: |
          git config user.name "loop-bot"
          git config user.email "loop-bot@users.noreply.github.com"
          git add CHANGELOG_DRAFT.md
          git commit -m "loop(release-drafter): draft CHANGELOG for ${{ github.ref_name }} [skip ci]"
          git push

      - name: Open review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('CHANGELOG_DRAFT.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[loop] Review release notes draft for ' + context.ref,
              body: body + '\n\n---\n🤖 Auto-generated by `loop(release-drafter)` L1.'
            });